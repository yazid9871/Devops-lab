{
  "apiVersion": "argoproj.io/v1alpha1",
  "kind": "Application",
  "metadata": {
    "name": "root",
    "namespace": "argocd",
    "annotations": {
      "argocd.argoproj.io/sync-wave": "0"
    }
  },
  "spec": {
    "project": "default",
    "source": {
      "repoURL": "https://github.com/yazid9871/Devops-lab.git",
      "targetRevision": "main",
      "path": "platform/apps",
      "directory": {
        "recurse": true
      }
    },
    "destination": {
      "server": "https://kubernetes.default.svc",
      "namespace": "argocd"
    },
    "syncPolicy": {
      "automated": {
        "prune": true,
        "selfHeal": true
      },
      "syncOptions": [
        "CreateNamespace=true",
        "ServerSideApply=true"
      ],
      "retry": {
        "limit": 8,
        "backoff": {
          "duration": "5s",
          "factor": 2,
          "maxDuration": "1m"
        }
      }
    }
  }
}
