{
  "apiVersion": "argoproj.io/v1alpha1",
  "kind": "Application",
  "metadata": {
    "name": "kube-prometheus-stack",
    "namespace": "argocd",
    "annotations": {
      "argocd.argoproj.io/sync-wave": "-30"
    }
  },
  "spec": {
    "project": "default",
    "source": {
      "repoURL": "https://prometheus-community.github.io/helm-charts",
      "chart": "kube-prometheus-stack",
      "targetRevision": "92.13.1",
      "helm": {
        "releaseName": "kps",
        "valuesObject": {
          "prometheusOperator": {
            "admissionWebhooks": {
              "enabled": false,
              "patch": {
                "enabled": false
              }
            },
            "tls": {
              "enabled": false
            }
          },
          "prometheus": {
            "prometheusSpec": {
              "retention": "2d",
              "scrapeInterval": "15s",
              "evaluationInterval": "15s",
              "resources": {
                "requests": {
                  "cpu": "100m",
                  "memory": "256Mi"
                },
                "limits": {
                  "cpu": "1",
                  "memory": "1Gi"
                }
              },
              "storageSpec": {
                "volumeClaimTemplate": {
                  "spec": {
                    "accessModes": [
                      "ReadWriteOnce"
                    ],
                    "storageClassName": "local-path",
                    "resources": {
                      "requests": {
                        "storage": "3Gi"
                      }
                    }
                  }
                }
              },
              "serviceMonitorSelectorNilUsesHelmValues": false,
              "podMonitorSelectorNilUsesHelmValues": false,
              "ruleSelectorNilUsesHelmValues": false
            }
          },
          "grafana": {
            "admin": {
              "existingSecret": "grafana-admin",
              "userKey": "admin-user",
              "passwordKey": "admin-password"
            },
            "resources": {
              "requests": {
                "cpu": "100m",
                "memory": "256Mi"
              },
              "limits": {
                "cpu": "1",
                "memory": "1Gi"
              }
            },
            "persistence": {
              "enabled": true,
              "storageClassName": "local-path",
              "size": "1Gi"
            },
            "env": {
              "GF_PLUGINS_PREINSTALL_AUTO_UPDATE": "false"
            },
            "ingress": {
              "enabled": true,
              "ingressClassName": "traefik",
              "hosts": [
                "grafana.localhost"
              ]
            },
            "sidecar": {
              "dashboards": {
                "enabled": true,
                "searchNamespace": "ALL"
              }
            },
            "additionalDataSources": [
              {
                "name": "Loki",
                "uid": "loki",
                "type": "loki",
                "url": "http://loki.tooling.svc.cluster.local:3100",
                "access": "proxy"
              }
            ]
          },
          "alertmanager": {
            "alertmanagerSpec": {
              "resources": {
                "requests": {
                  "cpu": "25m",
                  "memory": "64Mi"
                },
                "limits": {
                  "memory": "256Mi"
                }
              }
            }
          },
          "kubeEtcd": {
            "enabled": false
          },
          "kubeControllerManager": {
            "enabled": false
          },
          "kubeScheduler": {
            "enabled": false
          },
          "kubeProxy": {
            "enabled": false
          }
        }
      }
    },
    "destination": {
      "server": "https://kubernetes.default.svc",
      "namespace": "tooling"
    },
    "syncPolicy": {
      "automated": {
        "prune": true,
        "selfHeal": true
      },
      "syncOptions": [
        "CreateNamespace=true",
        "ServerSideApply=true"
      ],
      "retry": {
        "limit": 8,
        "backoff": {
          "duration": "5s",
          "factor": 2,
          "maxDuration": "1m"
        }
      }
    }
  }
}
