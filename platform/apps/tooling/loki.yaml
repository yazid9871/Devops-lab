{
  "apiVersion": "argoproj.io/v1alpha1",
  "kind": "Application",
  "metadata": {
    "name": "loki",
    "namespace": "argocd",
    "annotations": {
      "argocd.argoproj.io/sync-wave": "-20"
    }
  },
  "spec": {
    "project": "default",
    "source": {
      "repoURL": "https://grafana.github.io/helm-charts",
      "chart": "loki",
      "targetRevision": "7.5.0",
      "helm": {
        "releaseName": "loki",
        "valuesObject": {
          "deploymentMode": "SingleBinary",
          "loki": {
            "auth_enabled": false,
            "commonConfig": {
              "replication_factor": 1
            },
            "storage": {
              "type": "filesystem"
            },
            "schemaConfig": {
              "configs": [
                {
                  "from": "2024-04-01",
                  "store": "tsdb",
                  "object_store": "filesystem",
                  "schema": "v13",
                  "index": {
                    "prefix": "index_",
                    "period": "24h"
                  }
                }
              ]
            },
            "limits_config": {
              "retention_period": "48h"
            },
            "compactor": {
              "retention_enabled": true,
              "delete_request_store": "filesystem"
            }
          },
          "singleBinary": {
            "replicas": 1,
            "resources": {
              "requests": {
                "cpu": "50m",
                "memory": "128Mi"
              },
              "limits": {
                "memory": "512Mi"
              }
            },
            "persistence": {
              "enabled": true,
              "storageClass": "local-path",
              "size": "2Gi"
            }
          },
          "read": {
            "replicas": 0
          },
          "write": {
            "replicas": 0
          },
          "backend": {
            "replicas": 0
          },
          "chunksCache": {
            "enabled": false
          },
          "resultsCache": {
            "enabled": false
          },
          "gateway": {
            "enabled": false
          },
          "lokiCanary": {
            "enabled": false
          },
          "test": {
            "enabled": false
          }
        }
      }
    },
    "destination": {
      "server": "https://kubernetes.default.svc",
      "namespace": "tooling"
    },
    "syncPolicy": {
      "automated": {
        "prune": true,
        "selfHeal": true
      },
      "syncOptions": [
        "CreateNamespace=true",
        "ServerSideApply=true"
      ],
      "retry": {
        "limit": 8,
        "backoff": {
          "duration": "5s",
          "factor": 2,
          "maxDuration": "1m"
        }
      }
    }
  }
}
