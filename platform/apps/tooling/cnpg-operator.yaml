{
  "apiVersion": "argoproj.io/v1alpha1",
  "kind": "Application",
  "metadata": {
    "name": "cnpg-operator",
    "namespace": "argocd",
    "annotations": {
      "argocd.argoproj.io/sync-wave": "-10"
    }
  },
  "spec": {
    "project": "default",
    "source": {
      "repoURL": "https://cloudnative-pg.github.io/charts",
      "chart": "cloudnative-pg",
      "targetRevision": "0.29.1",
      "helm": {
        "releaseName": "cnpg",
        "valuesObject": {
          "replicaCount": 1,
          "monitoring": {
            "podMonitorEnabled": true,
            "podMonitorAdditionalLabels": {
              "release": "kps"
            }
          },
          "resources": {
            "requests": {
              "cpu": "50m",
              "memory": "128Mi"
            },
            "limits": {
              "memory": "256Mi"
            }
          }
        }
      }
    },
    "destination": {
      "server": "https://kubernetes.default.svc",
      "namespace": "cnpg-system"
    },
    "syncPolicy": {
      "automated": {
        "prune": true,
        "selfHeal": true
      },
      "syncOptions": [
        "CreateNamespace=true",
        "ServerSideApply=true"
      ],
      "retry": {
        "limit": 8,
        "backoff": {
          "duration": "5s",
          "factor": 2,
          "maxDuration": "1m"
        }
      }
    }
  }
}
