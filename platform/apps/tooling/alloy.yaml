{
  "apiVersion": "argoproj.io/v1alpha1",
  "kind": "Application",
  "metadata": {
    "name": "alloy",
    "namespace": "argocd",
    "annotations": {
      "argocd.argoproj.io/sync-wave": "-10"
    }
  },
  "spec": {
    "project": "default",
    "source": {
      "repoURL": "https://grafana.github.io/helm-charts",
      "chart": "alloy",
      "targetRevision": "1.14.3",
      "helm": {
        "releaseName": "alloy",
        "valuesObject": {
          "controller": {
            "type": "deployment",
            "replicas": 1
          },
          "alloy": {
            "configMap": {
              "content": "discovery.kubernetes \"pods\" {\n  role = \"pod\"\n  namespaces { names = [\"workload\", \"traefik\"] }\n}\ndiscovery.relabel \"logs\" {\n  targets = discovery.kubernetes.pods.targets\n  rule {\n    source_labels = [\"__meta_kubernetes_namespace\"]\n    target_label = \"namespace\"\n  }\n  rule {\n    source_labels = [\"__meta_kubernetes_pod_name\"]\n    target_label = \"pod\"\n  }\n  rule {\n    source_labels = [\"__meta_kubernetes_pod_container_name\"]\n    target_label = \"container\"\n  }\n}\nloki.source.kubernetes \"pods\" {\n  targets = discovery.relabel.logs.output\n  forward_to = [loki.write.local.receiver]\n}\nloki.write \"local\" {\n  endpoint { url = \"http://loki.tooling.svc.cluster.local:3100/loki/api/v1/push\" }\n}\n"
            },
            "resources": {
              "requests": {
                "cpu": "25m",
                "memory": "64Mi"
              },
              "limits": {
                "memory": "256Mi"
              }
            }
          },
          "rbac": {
            "namespaces": [
              "workload",
              "traefik"
            ],
            "rules": [
              {
                "apiGroups": [
                  ""
                ],
                "resources": [
                  "pods",
                  "pods/log"
                ],
                "verbs": [
                  "get",
                  "list",
                  "watch"
                ]
              }
            ]
          }
        }
      }
    },
    "destination": {
      "server": "https://kubernetes.default.svc",
      "namespace": "tooling"
    },
    "syncPolicy": {
      "automated": {
        "prune": true,
        "selfHeal": true
      },
      "syncOptions": [
        "CreateNamespace=true",
        "ServerSideApply=true"
      ],
      "retry": {
        "limit": 8,
        "backoff": {
          "duration": "5s",
          "factor": 2,
          "maxDuration": "1m"
        }
      }
    }
  }
}
