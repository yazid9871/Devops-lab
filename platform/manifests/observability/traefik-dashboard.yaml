y\": 27, \"w\": 12, \"h\": 4}, \"targets\": [{\"refId\": \"A\", \"expr\": \"(sum(increase(traefik_router_requests_total{namespace=\\\"traefik\\\",router=~\\\"workload-myapp-.*\\\"}[5m])) or (0 * max(up{namespace=\\\"traefik\\\"} == 1)))\", \"legendFormat\": \"Reçues\", \"instant\": true, \"range\": false}], \"fieldConfig\": {\"defaults\": {\"unit\": \"short\", \"decimals\": 0, \"noValue\": \"Pas de données\", \"color\": {\"mode\": \"palette-classic\"}, \"thresholds\": {\"mode\": \"absolute\", \"steps\": [{\"color\": \"green\", \"value\": null}]}}, \"overrides\": []}, \"options\": {\"colorMode\": \"value\", \"graphMode\": \"none\", \"textMode\": \"auto\", \"reduceOptions\": {\"calcs\": [\"lastNotNull\"], \"fields\": \"\", \"values\": false}}}, {\"id\": 12, \"title\": \"Requêtes backend sur 5 min (est.)\", \"description\": \"Requêtes effectivement confiées au Service applicatif. La comparaison avec les reçues illustre le filtrage.\", \"type\": \"stat\", \"datasource\": {\"type\": \"prometheus\", \"uid\": \"prometheus\"}, \"gridPos\": {\"x\": 12, \"y\": 27, \"w\": 12, \"h\": 4}, \"targets\": [{\"refId\": \"A\", \"expr\": \"(sum(increase(traefik_service_requests_total{namespace=\\\"traefik\\\",service=~\\\"workload-myapp-.*\\\"}[5m])) or (0 * max(up{namespace=\\\"traefik\\\"} == 1)))\", \"legendFormat\": \"Backend\", \"instant\": true, \"range\": false}], \"fieldConfig\": {\"defaults\": {\"unit\": \"short\", \"decimals\": 0, \"noValue\": \"Pas de données\", \"color\": {\"mode\": \"palette-classic\"}, \"thresholds\": {\"mode\": \"absolute\", \"steps\": [{\"color\": \"green\", \"value\": null}]}}, \"overrides\": []}, \"options\": {\"colorMode\": \"value\", \"graphMode\": \"none\", \"textMode\": \"auto\", \"reduceOptions\": {\"calcs\": [\"lastNotNull\"], \"fields\": \"\", \"values\": false}}}], \"templating\": {\"list\": []}, \"annotations\": {\"list\": []}, \"timepicker\": {\"refresh_intervals\": [\"5s\", \"15s\", \"30s\", \"1m\", \"5m\"]}}"
