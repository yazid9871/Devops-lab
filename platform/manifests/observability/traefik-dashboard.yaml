    "traefik.json": "{\"uid\": \"traefik-k3d\", \"title\": \"Traefik - k3d\", \"schemaVersion\": 39, \"version\": 2, \"timezone\": \"browser\", \"refresh\": \"15s\", \"time\": {\"from\": \"now-15m\", \"to\": \"now\"}, \"tags\": [\"devops-lab\", \"traefik\", \"rate-limit\"], \"description\": \"Traefik rate limit: 5 req/s, burst 10. One proxy; local k3d lab.\", \"links\": [{\"title\": \"Application\", \"type\": \"link\", \"url\": \"/d/myapp-overview\"}], \"panels\": [{\"id\": 1, \"title\": \"Collecte Traefik (1 = disponible)\", \"description\": \"État de la cible Prometheus : ce panneau reste rouge si le scrape échoue. Les autres panneaux ne remplacent pas ce contrôle.\", \"type\": \"stat\", \"datasource\": {\"type\": \"prometheus\", \"uid\": \"prometheus\"}, \"gridPos\": {\"x\": 0, \"y\": 0, \"w\": 6, \"h\": 4}, \"targets\": [{\"refId\": \"A\", \"expr\": \"max(up{namespace=\\\"traefik\\\"})\", \"legendFormat\": \"Collecte\", \"instant\": true, \"range\": false}], \"fieldConfig\": {\"defaults\": {\"unit\": \"short\", \"decimals\": 0, \"noValue\": \"Pas de données\", \"color\": {\"mode\": \"thresholds\"}, \"thresholds\": {\"mode\": \"absolute\", \"steps\": [{\"color\": \"red\", \"value\": null}, {\"color\": \"green\", \"value\": 1}]}}, \"overrides\": []}, \"options\": {\"colorMode\": \"value\", \"graphMode\": \"none\", \"textMode\": \"auto\", \"reduceOptions\": {\"calcs\": [\"lastNotNull\"], \"fields\": \"\", \"values\": false}}}, {\"id\": 2, \"title\": \"Débit reçu par le routeur\", \"description\": \"Moyenne sur 2 minutes, sur la route de l’application uniquement.\", \"type\": \"stat\", \"datasource\": {\"type\": \"prometheus\", \"uid\": \"prometheus\"}, \"gridPos\": {\"x\": 6, \"y\": 0, \"w\": 6, \"h\": 4}, \"targets\": [{\"refId\": \"A\", \"expr\": \"(sum(rate(traefik_router_requests_total{namespace=\\\"traefik\\\",router=~\\\"workload-myapp-.*\\\"}[2m])) or (0 * max(up{namespace=\\\"traefik\\\"} == 1)))\", \"legendFormat\": \"Reçues\", \"instant\": true, \"range\": false}], \"fieldConfig\": {\"defaults\": {\"unit\": \"reqps\", \"decimals\": 2, \"noValue\": \"Pas de données\", \"color\": {\"mode\": \"palette-classic\"}, \"thresholds\": {\"mode\": \"absolute\", \"steps\": [{\"color\": \"green\", \"value\": null}]}}, \"overrides\": []}, \"options\": {\"colorMode\": \"value\", \"graphMode\": \"none\", \"textMode\": \"auto\", \"reduceOptions\": {\"calcs\": [\"lastNotNull\"], \"fields\": \"\", \"values\": false}}}, {\"id\": 3, \"title\": \"Réponses 429 sur 5 min (est.)\", \"description\": \"Estimation Prometheus sur 5 minutes ; extrapolation possible, ce n’est pas le compte exact du générateur.\", \"type\": \"stat\", \"datasource\": {\"type\": \"prometheus\", \"uid\": \"prometheus\"}, \"gridPos\": {\"x\": 12, \"y\": 0, \"w\": 6, \"h\": 4}, \"targets\": [{\"refId\": \"A\", \"expr\": \"(sum(increase(traefik_router_requests_total{namespace=\\\"traefik\\\",router=~\\\"workload-myapp-.*\\\",code=\\\"429\\\"}[5m])) or (0 * max(up{namespace=\\\"traefik\\\"} == 1)))\", \"legendFormat\": \"429\", \"instant\": true, \"range\": false}], \"fieldConfig\": {\"defaults\": {\"unit\": \"short\", \"decimals\": 0, \"noValue\": \"Pas de données\", \"color\": {\"mode\": \"palette-classic\"}, \"thresholds\": {\"mode\": \"absolute\", \"steps\": [{\"color\": \"green\", \"value\": null}]}}, \"overrides\": []}, \"options\": {\"colorMode\": \"value\", \"graphMode\": \"none\", \"textMode\": \"auto\", \"reduceOptions\": {\"calcs\": [\"lastNotNull\"], \"fields\": \"\", \"values\": false}}}, {\"id\": 4, \"title\": \"Part de réponses 429\", \"description\": \"Part des réponses 429 dans les requêtes de la route, sur 2 minutes. Zéro en absence de trafic si la collecte fonctionne.\", \"type\": \"stat\", \"datasource\": {\"type\": \"prometheus\", \"uid\": \"prometheus\"}, \"gridPos\": {\"x\": 18, \"y\": 0, \"w\": 6, \"h\": 4}, \"targets\": [{\"refId\": \"A\", \"expr\": \"100 * (sum(rate(traefik_router_requests_total{namespace=\\\"traefik\\\",router=~\\\"workload-myapp-.*\\\",code=~\\\"429\\\"}[2m])) or (0 * max(up{namespace=\\\"traefik\\\"} == 1))) / clamp_min((sum(rate(traefik_router_requests_total{namespace=\\\"traefik\\\",router=~\\\"workload-myapp-.*\\\"}[2m])) or (0 * max(up{namespace=\\\"traefik\\\"} == 1))), 0.000000001)\", \"legendFormat\": \"429\", \"instant\": true, \"range\": false}], \"fieldConfig\": {\"defaults\": {\"unit\": \"percent\", \"decimals\": 2, \"noValue\": \"Pas de données\", \"color\": {\"mode\": \"palette-classic\"}, \"thresholds\": {\"mode\": \"absolute\", \"steps\": [{\"color\": \"green\", \"value\": null}]}}, \"overrides\": []}, \"options\": {\"colorMode\": \"value\", \"graphMode\": \"none\", \"textMode\": \"auto\", \"reduceOptions\": {\"calcs\": [\"lastNotNull\"], \"fields\": \"\", \"values\": false}}}, {\"id\": 5, \"title\": \"Réponses HTTP par code\", \"description\": \"200, 404, 429 et les autres codes réellement observés ; aucun label IP ou URL brute.\", \"type\": \"timeseries\", \"datasource\": {\"type\": \"prometheus\", \"uid\": \"prometheus\"}, \"gridPos\": {\"x\": 0, \"y\": 4, \"w\": 12, \"h\": 8}, \"targets\": [{\"refId\": \"A\", \"expr\": \"sum by (code) (rate(traefik_router_requests_total{namespace=\\\"traefik\\\",router=~\\\"workload-myapp-.*\\\"}[2m]))\", \"legendFormat\": \"HTTP {{code}}\", \"instant\": false, \"range\": true}], \"fieldConfig\": {\"defaults\": {\"unit\": \"reqps\", \"decimals\": 2, \"noValue\": \"Pas de données\", \"color\": {\"mode\": \"palette-classic\"}, \"thresholds\": {\"mode\": \"absolute\", \"steps\": [{\"color\": \"green\", \"value\": null}]}, \"custom\": {\"drawStyle\": \"line\", \"lineWidth\": 2, \"fillOpacity\": 8, \"showPoints\": \"never\", \"spanNulls\": false}}, \"overrides\": []}, \"options\": {\"legend\": {\"displayMode\": \"list\", \"placement\": \"bottom\"}, \"tooltip\": {\"mode\": \"multi\", \"sort\": \"desc\"}}}, {\"id\": 6, \"title\": \"Reçues et transmises au backend\", \"description\": \"Les rejets du Middleware ne sont pas transmis au Service applicatif. Les deux courbes utilisent une moyenne sur 2 minutes.\", \"type\": \"timeseries\", \"datasource\": {\"type\": \"prometheus\", \"uid\": \"prometheus\"}, \"gridPos\": {\"x\": 12, \"y\": 4, \"w\": 12, \"h\": 8}, \"targets\": [{\"refId\": \"A\", \"expr\": \"(sum(rate(traefik_router_requests_total{namespace=\\\"traefik\\\",router=~\\\"workload-myapp-.*\\\"}[2m])) or (0 * max(up{namespace=\\\"traefik\\\"} == 1)))\", \"legendFormat\": \"Reçues par Traefik\", \"instant\": false, \"range\": true}, {\"refId\": \"B\", \"expr\": \"(sum(rate(traefik_service_requests_total{namespace=\\\"traefik\\\",service=~\\\"workload-myapp-.*\\\"}[2m])) or (0 * max(up{namespace=\\\"traefik\\\"} == 1)))\", \"legendFormat\": \"Transmises au backend\", \"instant\": false, \"range\": true}], \"fieldConfig\": {\"defaults\": {\"unit\": \"reqps\", \"decimals\": 2, \"noValue\": \"Pas de données\", \"color\": {\"mode\": \"palette-classic\"}, \"thresholds\": {\"mode\": \"absolute\", \"steps\": [{\"color\": \"green\", \"value\": null}]}, \"custom\": {\"drawStyle\": \"line\", \"lineWidth\": 2, \"fillOpacity\": 8, \"showPoints\": \"never\", \"spanNulls\": false}}, \"overrides\": []}, \"options\": {\"legend\": {\"displayMode\": \"list\", \"placement\": \"bottom\"}, \"tooltip\": {\"mode\": \"multi\", \"sort\": \"desc\"}}}, {\"id\": 7, \"title\": \"Latence p95 des réponses 2xx\", \"description\": \"Estimation par histogramme. Exclut les 429. Pas de valeur exploitable tant qu’il n’y a pas assez de trafic 2xx et de scrapes ; ne pas interpréter une absence comme 0 ms.\", \"type\": \"timeseries\", \"datasource\": {\"type\": \"prometheus\", \"uid\": \"prometheus\"}, \"gridPos\": {\"x\": 0, \"y\": 12, \"w\": 12, \"h\": 8}, \"targets\": [{\"refId\": \"A\", \"expr\": \"histogram_quantile(0.95, sum by (le) (rate(traefik_router_request_duration_seconds_bucket{namespace=\\\"traefik\\\",router=~\\\"workload-myapp-.*\\\",code=~\\\"2..\\\"}[2m])))\", \"legendFormat\": \"p95 2xx\", \"instant\": false, \"range\": true}], \"fieldConfig\": {\"defaults\": {\"unit\": \"s\", \"decimals\": 4, \"noValue\": \"Pas de données\", \"color\": {\"mode\": \"palette-classic\"}, \"thresholds\": {\"mode\": \"absolute\", \"steps\": [{\"color\": \"green\", \"value\": null}]}, \"custom\": {\"drawStyle\": \"line\", \"lineWidth\": 2, \"fillOpacity\": 8, \"showPoints\": \"never\", \"spanNulls\": false}}, \"overrides\": []}, \"options\": {\"legend\": {\"displayMode\": \"list\", \"placement\": \"bottom\"}, \"tooltip\": {\"mode\": \"multi\", \"sort\": \"desc\"}}}, {\"id\": 8, \"title\": \"Erreurs HTTP 5xx\", \"description\": \"Débit des réponses 5xx du routeur applicatif, séparé des refus 429.\", \"type\": \"timeseries\", \"datasource\": {\"type\": \"prometheus\", \"uid\": \"prometheus\"}, \"gridPos\": {\"x\": 12, \"y\": 12, \"w\": 12, \"h\": 8}, \"targets\": [{\"refId\": \"A\", \"expr\": \"(sum(rate(traefik_router_requests_total{namespace=\\\"traefik\\\",router=~\\\"workload-myapp-.*\\\",code=~\\\"5..\\\"}[2m])) or (0 * max(up{namespace=\\\"traefik\\\"} == 1)))\", \"legendFormat\": \"5xx\", \"instant\": false, \"range\": true}], \"fieldConfig\": {\"defaults\": {\"unit\": \"reqps\", \"decimals\": 2, \"noValue\": \"Pas de données\", \"color\": {\"mode\": \"palette-classic\"}, \"thresholds\": {\"mode\": \"absolute\", \"steps\": [{\"color\": \"green\", \"value\": null}]}, \"custom\": {\"drawStyle\": \"line\", \"lineWidth\": 2, \"fillOpacity\": 8, \"showPoints\": \"never\", \"spanNulls\": false}}, \"overrides\": []}, \"options\": {\"legend\": {\"displayMode\": \"list\", \"placement\": \"bottom\"}, \"tooltip\": {\"mode\": \"multi\", \"sort\": \"desc\"}}}, {\"id\": 9, \"title\": \"CPU du processus Traefik\", \"description\": \"Consommation CPU du processus en cœurs, pas un pourcentage de la limite Kubernetes.\", \"type\": \"timeseries\", \"datasource\": {\"type\": \"prometheus\", \"uid\": \"prometheus\"}, \"gridPos\": {\"x\": 0, \"y\": 20, \"w\": 12, \"h\": 7}, \"targets\": [{\"refId\": \"A\", \"expr\": \"