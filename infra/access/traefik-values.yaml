# Values for the pinned Traefik chart in versions.psd1.
deployment:
  replicas: 1
ingressClass:
  enabled: true
  isDefaultClass: false
  name: traefik-lab
providers:
  kubernetesCRD:
    enabled: true
    namespaces:
      - demo
    allowCrossNamespace: false
    allowExternalNameServices: false
  kubernetesGateway:
    enabled: false
  kubernetesIngress:
    enabled: true
    ingressClass: traefik-lab
    namespaces:
      - demo
    publishedService:
      enabled: false
    ingressEndpoint:
      ip: 127.0.0.1
gateway:
  enabled: false
gatewayClass:
  enabled: false
service:
  spec:
    type: ClusterIP
api:
  dashboard: false
  insecure: false
ingressRoute:
  dashboard:
    enabled: false
metrics:
  prometheus:
    entryPoint: metrics
    addEntryPointsLabels: true
    addRoutersLabels: true
    addServicesLabels: true
    buckets: "0.005,0.01,0.025,0.05,0.1,0.25,0.5,1,2,5"
    service:
      enabled: true
    serviceMonitor:
      enabled: false
resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 500m
    memory: 256Mi
