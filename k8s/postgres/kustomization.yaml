apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: data
resources:
  - namespace.yaml
  - service.yaml
  - statefulset.yaml
  - backup-pvc.yaml
  - backup-cronjob.yaml
configMapGenerator:
  - name: postgres-init
    files:
      - 01-demo.sql=init.sql

  - name: postgres-backup-scripts
    files:
      - backup.sh
      - restore.sh
      - verify.sql
