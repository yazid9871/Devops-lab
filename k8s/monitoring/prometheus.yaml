apiVersion: "v1"
kind: "List"
items:
  -
    apiVersion: "v1"
    kind: "PersistentVolumeClaim"
    metadata:
      name: "prometheus-data"
      namespace: "monitoring"
    spec:
      accessModes:
        - "ReadWriteOnce"
      storageClassName: "standard"
      resources:
        requests:
          storage: "2Gi"
  -
    apiVersion: "v1"
    kind: "Service"
    metadata:
      name: "prometheus"
      namespace: "monitoring"
    spec:
      selector:
        app: "prometheus"
      ports:
        -
          name: "web"
          port: 9090
          targetPort: "web"
  -
    apiVersion: "apps/v1"
    kind: "Deployment"
    metadata:
      name: "prometheus"
      namespace: "monitoring"
    spec:
      replicas: 1
      strategy:
        type: "Recreate"
      selector:
        matchLabels:
          app: "prometheus"
      template:
        metadata:
          labels:
            app: "prometheus"
        spec:
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
            fsGroup: 65534
            seccompProfile:
              type: "RuntimeDefault"
          containers:
            -
              name: "prometheus"
              image: "prom/prometheus:v3.15.0@sha256:efd719c99d83b060d9daefdcf00360461adf279f45ef5391f8d111892118753e"
              ports:
                -
                  name: "web"
                  containerPort: 9090
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - "ALL"
              resources:
                requests:
                  cpu: "200m"
                  memory: "256Mi"
                limits:
                  cpu: "1"
                  memory: "1Gi"
              volumeMounts:
                -
                  name: "config"
                  mountPath: "/etc/prometheus/config"
                  readOnly: true
                -
                  name: "rules"
                  mountPath: "/etc/prometheus/rules"
                  readOnly: true
                -
                  name: "tests"
                  mountPath: "/etc/prometheus/tests"
                  readOnly: true
                -
                  name: "storage"
                  mountPath: "/prometheus"
                -
                  name: "tmp"
                  mountPath: "/tmp"
              readinessProbe:
                httpGet:
                  path: "/-/ready"
                  port: "web"
                initialDelaySeconds: 5
                periodSeconds: 5
              livenessProbe:
                httpGet:
                  path: "/-/ready"
                  port: "web"
                initialDelaySeconds: 30
                periodSeconds: 15
              args:
                - "--config.file=/etc/prometheus/config/prometheus.yml"
                - "--storage.tsdb.path=/prometheus"
                - "--storage.tsdb.retention.time=6h"
                - "--storage.tsdb.retention.size=1GB"
          volumes:
            -
              name: "config"
              configMap:
                name: "prometheus-config"
            -
              name: "rules"
              configMap:
                name: "prometheus-rules"
            -
              name: "tests"
              configMap:
                name: "prometheus-tests"
            -
              name: "storage"
              persistentVolumeClaim:
                claimName: "prometheus-data"
            -
              name: "tmp"
              emptyDir: {}
