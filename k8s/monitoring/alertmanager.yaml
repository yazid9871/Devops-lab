apiVersion: "v1"
kind: "List"
items:
  -
    apiVersion: "v1"
    kind: "Service"
    metadata:
      name: "alertmanager"
      namespace: "monitoring"
    spec:
      selector:
        app: "alertmanager"
      ports:
        -
          name: "web"
          port: 9093
          targetPort: "web"
  -
    apiVersion: "apps/v1"
    kind: "Deployment"
    metadata:
      name: "alertmanager"
      namespace: "monitoring"
    spec:
      replicas: 1
      strategy:
        type: "Recreate"
      selector:
        matchLabels:
          app: "alertmanager"
      template:
        metadata:
          labels:
            app: "alertmanager"
        spec:
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
            fsGroup: 65534
            seccompProfile:
              type: "RuntimeDefault"
          containers:
            -
              name: "alertmanager"
              image: "prom/alertmanager:v0.34.1@sha256:e9733bafb1bdef9b00e25a21f8f99dc26a22224bf16641ad754d1649f4c3357a"
              ports:
                -
                  name: "web"
                  containerPort: 9093
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - "ALL"
              resources:
                requests:
                  cpu: "50m"
                  memory: "64Mi"
                limits:
                  cpu: "500m"
                  memory: "256Mi"
              volumeMounts:
                -
                  name: "config"
                  mountPath: "/etc/alertmanager/config"
                  readOnly: true
                -
                  name: "storage"
                  mountPath: "/alertmanager"
                -
                  name: "tmp"
                  mountPath: "/tmp"
              readinessProbe:
                httpGet:
                  path: "/-/ready"
                  port: "web"
                initialDelaySeconds: 5
                periodSeconds: 5
              livenessProbe:
                httpGet:
                  path: "/-/ready"
                  port: "web"
                initialDelaySeconds: 30
                periodSeconds: 15
              args:
                - "--config.file=/etc/alertmanager/config/alertmanager.yml"
                - "--storage.path=/alertmanager"
                - "--cluster.listen-address="
          volumes:
            -
              name: "config"
              configMap:
                name: "alertmanager-config"
            -
              name: "storage"
              emptyDir: {}
            -
              name: "tmp"
              emptyDir: {}
