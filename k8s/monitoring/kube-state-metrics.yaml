apiVersion: "v1"
kind: "List"
items:
  -
    apiVersion: "v1"
    kind: "ServiceAccount"
    metadata:
      name: "kube-state-metrics"
      namespace: "monitoring"
  -
    apiVersion: "rbac.authorization.k8s.io/v1"
    kind: "ClusterRole"
    metadata:
      name: "devops-lab-kube-state-metrics"
    rules:
      -
        apiGroups:
          - ""
        resources:
          - "pods"
          - "persistentvolumeclaims"
        verbs:
          - "list"
          - "watch"
      -
        apiGroups:
          - "apps"
        resources:
          - "deployments"
          - "statefulsets"
        verbs:
          - "list"
          - "watch"
      -
        apiGroups:
          - "batch"
        resources:
          - "jobs"
          - "cronjobs"
        verbs:
          - "list"
          - "watch"
  -
    apiVersion: "rbac.authorization.k8s.io/v1"
    kind: "ClusterRoleBinding"
    metadata:
      name: "devops-lab-kube-state-metrics"
    roleRef:
      apiGroup: "rbac.authorization.k8s.io"
      kind: "ClusterRole"
      name: "devops-lab-kube-state-metrics"
    subjects:
      -
        kind: "ServiceAccount"
        name: "kube-state-metrics"
        namespace: "monitoring"
  -
    apiVersion: "v1"
    kind: "Service"
    metadata:
      name: "kube-state-metrics"
      namespace: "monitoring"
    spec:
      selector:
        app: "kube-state-metrics"
      ports:
        -
          name: "web"
          port: 8080
          targetPort: "web"
  -
    apiVersion: "apps/v1"
    kind: "Deployment"
    metadata:
      name: "kube-state-metrics"
      namespace: "monitoring"
    spec:
      replicas: 1
      strategy:
        type: "Recreate"
      selector:
        matchLabels:
          app: "kube-state-metrics"
      template:
        metadata:
          labels:
            app: "kube-state-metrics"
        spec:
          automountServiceAccountToken: true
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
            fsGroup: 65534
            seccompProfile:
              type: "RuntimeDefault"
          containers:
            -
              name: "kube-state-metrics"
              image: "registry.k8s.io/kube-state-metrics/kube-state-metrics:v2.20.0@sha256:42cfe3723a5f058171c627537fb57a3ea0f26e4380fa18555a95cb1a1b4cfc5b"
              ports:
                -
                  name: "web"
                  containerPort: 8080
                -
                  name: "telemetry"
                  containerPort: 8081
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - "ALL"
              resources:
                requests:
                  cpu: "50m"
                  memory: "64Mi"
                limits:
                  cpu: "500m"
                  memory: "256Mi"
              volumeMounts:
                -
                  name: "tmp"
                  mountPath: "/tmp"
              readinessProbe:
                httpGet:
                  path: "/healthz"
                  port: "web"
                initialDelaySeconds: 5
                periodSeconds: 5
              livenessProbe:
                httpGet:
                  path: "/healthz"
                  port: "web"
                initialDelaySeconds: 30
                periodSeconds: 15
              args:
                - "--resources=pods,jobs,cronjobs,deployments,statefulsets,persistentvolumeclaims"
          volumes:
            -
              name: "tmp"
              emptyDir: {}
          serviceAccountName: "kube-state-metrics"
