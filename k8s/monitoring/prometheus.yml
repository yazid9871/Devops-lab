global:
  scrape_interval: "15s"
  evaluation_interval: "15s"
  scrape_timeout: "10s"
rule_files:
  - "/etc/prometheus/rules/alerts.yaml"
alerting:
  alertmanagers:
    -
      static_configs:
        -
          targets:
            - "alertmanager.monitoring.svc.cluster.local:9093"
scrape_configs:
  -
    job_name: "prometheus"
    static_configs:
      -
        targets:
          - "prometheus.monitoring.svc.cluster.local:9090"
  -
    job_name: "kube-state-metrics"
    static_configs:
      -
        targets:
          - "kube-state-metrics.monitoring.svc.cluster.local:8080"
  -
    job_name: "postgres"
    static_configs:
      -
        targets:
          - "postgres-exporter.data.svc.cluster.local:9187"
  - job_name: redis
    static_configs:
      - targets: ["redis.data.svc.cluster.local:9121"]
